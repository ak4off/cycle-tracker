<!DOCTYPE html>
<html>
<head>
  <title>Settings</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">

  <h1>⚙️ Settings</h1>

  <div class="card">
    <h3>📆 Calendar Sync</h3>
    <p style="color: var(--muted); font-size: 0.9rem;">
      Sync predicted cycle dates to your Google Calendar.
      This is one-way and fully optional.
    </p>

    <label>
      <input type="checkbox" id="syncPeriod" checked>
      Sync period predictions
    </label>

    <label>
      <input type="checkbox" id="syncFertile">
      Sync fertile window
    </label>

    <label>
      <input type="checkbox" id="syncOvulation">
      Sync ovulation estimate
    </label>

    <div style="margin-top: 1rem;">
      <button onclick="connectGoogleCalendar()">📆 Connect Google Calendar</button>
      <button onclick="syncToGoogleCalendar()">🔁 Sync to Google Calendar</button>
    </div>
  </div>

  <div class="card">
    <h3>🔒 Privacy</h3>
    <p style="color: var(--muted); font-size: 0.9rem;">
      All data is stored locally on your device.
      You can delete everything at any time.
    </p>
    <button onclick="deleteData()" style="background:#ef4444">
      🗑 Delete All Data
    </button>
  </div>

  <div class="nav">
    <a href="index.html">← Back</a>
  </div>

</div>

<!-- Scripts (order matters) -->
<script src="js/state.js"></script>
<script src="js/cycle.js"></script>
<script src="js/sync.js"></script>

<script>
  // OAuth token capture
  if (window.location.hash) {
    const params = new URLSearchParams(window.location.hash.substring(1));
    const token = params.get("access_token");

    if (token) {
      localStorage.setItem("google_access_token", token);
      alert("Google Calendar connected successfully!");
      history.replaceState({}, document.title, window.location.pathname);
    }
  }

  // Delete data
  function deleteData() {
    localStorage.clear();
    alert("All data deleted.");
    location.href = "index.html";
  }
</script>

</body>
</html>
